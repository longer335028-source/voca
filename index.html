<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3157d5">
  <meta name="description" content="EBS 영어 영역 어휘 및 어구를 회차·문항별로 학습하는 단어 학습 앱">
  <title>EBS VOCA Study</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app-main">본문으로 건너뛰기</a>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="홈으로 이동">
        <span class="brand-mark">E</span>
        <span><strong>EBS VOCA</strong><small>Study</small></span>
      </button>
      <div class="top-actions">
        <span class="today-progress" id="today-progress" aria-live="polite"></span>
        <button class="icon-button" id="theme-toggle" aria-label="테마 변경" title="테마 변경">◐</button>
      </div>
    </header>

    <nav class="desktop-nav" aria-label="주요 메뉴">
      <button data-route="home"><span>⌂</span> 홈</button>
      <button data-route="study"><span>▶</span> 학습</button>
      <button data-route="words"><span>☷</span> 단어장</button>
      <button data-route="review"><span>↻</span> 복습</button>
      <button data-route="settings"><span>⚙</span> 설정</button>
    </nav>

    <main id="app-main" tabindex="-1">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-study" data-view="study" hidden></section>
      <section class="view" id="view-session" data-view="session" hidden></section>
      <section class="view" id="view-result" data-view="result" hidden></section>
      <section class="view" id="view-words" data-view="words" hidden></section>
      <section class="view" id="view-review" data-view="review" hidden></section>
      <section class="view" id="view-settings" data-view="settings" hidden></section>
    </main>

    <nav class="mobile-nav" aria-label="모바일 주요 메뉴">
      <button data-route="home"><span>⌂</span><small>홈</small></button>
      <button data-route="study"><span>▶</span><small>학습</small></button>
      <button data-route="words"><span>☷</span><small>단어장</small></button>
      <button data-route="review"><span>↻</span><small>복습</small></button>
      <button data-route="settings"><span>⚙</span><small>설정</small></button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2 id="dialog-title">확인</h2>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button value="cancel" class="button secondary">취소</button>
        <button value="confirm" class="button danger">삭제</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
